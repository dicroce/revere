name: Build & Release Windows

# Two triggers:
#   - push of a v* tag  -> build AND publish a (draft, prerelease) GitHub Release
#   - workflow_dispatch -> build only (for testing); no release is created
#
# NOTE: the in-app "Download Revere Cloud" URL embeds REVERE_VERSION, which only
# resolves to a clean X.Y.Z when HEAD is exactly on a v* tag. workflow_dispatch
# runs off a branch, so installers built that way are named with the short git
# hash (revere-v<hash>-...) — fine for testing, but real cloud-download links
# only work from tagged release builds.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# NOTE: a v* tag publishes a PUBLIC release immediately (live in-app download
# links, no human step). A bad tag ships publicly until deleted — push tags
# deliberately. The version guard below is the safety net against dead links.

# Read-only by default; only the release job writes (it creates the Release and uploads assets).
permissions:
  contents: read

env:
  # Bump these together when publishing a new dependency bundle from revere-deps.
  DEPS_REPO: dicroce/revere-deps
  DEPS_VERSION: windows-deps-v2
  # The public half of the plugin signing key: the same key as
  # r_vss::trusted_plugin_keys() (libs/r_vss/source/r_plugin_manifest.cpp). The sign
  # job refuses a REVERE_PLUGIN_SIGNING_KEY secret that isn't its private half.
  TRUSTED_PLUGIN_KEY: |
    -----BEGIN PUBLIC KEY-----
    MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEyoJaveiI9dV8iMd1BCuTJ5waLQlE
    Lb/o4EjKncI5WScnbgqhP/t4XoNJxwdCaXcnMAEmMUy733L4laq3PEZGhg==
    -----END PUBLIC KEY-----
  # Release tag builds load only signed system plugins (r_vss/r_system_plugin_host.h).
  REQUIRE_SIGNED_PLUGINS: ${{ startsWith(github.ref, 'refs/tags/') && 'ON' || 'OFF' }}

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      cloud_ref: ${{ steps.cloudref.outputs.ref }}

    steps:
      - name: Checkout revere
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: revere
          # Full history + tags so CMake's `git describe` version detection works.
          fetch-depth: 0

      # Releases are version-locked: a v* tag build uses the SAME tag in
      # revere_cloud. Tag builds fail loudly if revere_cloud is missing that tag
      # (rather than silently shipping main). Non-tag (workflow_dispatch) test
      # builds just use revere_cloud's main.
      - name: Determine revere_cloud ref
        id: cloudref
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REVERE_CLOUD_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            if gh api "repos/dicroce/revere_cloud/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "Using revere_cloud @ ${tag}"
              echo "ref=${tag}" >> "$GITHUB_OUTPUT"
            else
              echo "::error::revere_cloud is missing tag '${tag}'. Releases are version-locked:"
              echo "::error::tag revere_cloud too -> (cd revere_cloud && git tag ${tag} && git push origin ${tag})"
              exit 1
            fi
          else
            echo "Non-tag build; using revere_cloud @ main"
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout revere_cloud
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dicroce/revere_cloud
          ref: ${{ steps.cloudref.outputs.ref }}
          path: revere_cloud
          fetch-depth: 0
          # revere_cloud is PRIVATE and lives in a different repo than this
          # workflow, so the default GITHUB_TOKEN can't read it. Provide a PAT
          # (or fine-grained token) with read access to revere_cloud as the
          # repo secret REVERE_CLOUD_TOKEN. Create one with:
          #   gh secret set REVERE_CLOUD_TOKEN --repo dicroce/revere --body <token>
          token: ${{ secrets.REVERE_CLOUD_TOKEN }}

      - name: Checkout revere-deps (manifest only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DEPS_REPO }}
          path: revere-deps

      # Native deps (OpenCV/GStreamer/FFmpeg/NCNN) are restored from cache keyed
      # on DEPS_VERSION. On a hit, nothing is downloaded. On a miss, the next step
      # fetches + sha256-verifies each asset from the revere-deps release.
      - name: Restore cached dependencies
        id: cache-deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ env.DEPS_VERSION }}

      - name: Download & verify dependencies (cache miss only)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $manifest = Get-Content revere-deps/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.deps_version -ne "${{ env.DEPS_VERSION }}") {
            throw "manifest deps_version '$($manifest.deps_version)' != expected '${{ env.DEPS_VERSION }}'. Update DEPS_VERSION or the manifest."
          }
          New-Item -ItemType Directory -Force -Path deps | Out-Null
          foreach ($p in $manifest.deps.PSObject.Properties) {
            $name = $p.Name
            $d    = $p.Value
            $zip  = Join-Path $env:RUNNER_TEMP $d.file
            Write-Host "==> $name : downloading $($d.url)"
            Invoke-WebRequest -Uri $d.url -OutFile $zip
            $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            if ($sha -ne $d.sha256.ToLower()) {
              throw "sha256 mismatch for ${name}: got $sha expected $($d.sha256)"
            }
            Write-Host "    sha256 OK; extracting to deps/$name"
            Expand-Archive -Path $zip -DestinationPath (Join-Path deps $name) -Force
            Remove-Item $zip -Force
          }

      - name: Set dependency environment variables
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}\deps"
          # Each zip was packaged without a base dir, so the tree root (bin/, include/,
          # x64/, ...) sits directly under deps\<name> — exactly what *_TOP_DIR expects.
          Add-Content $env:GITHUB_ENV "OPENCV_TOP_DIR=$root\opencv"
          Add-Content $env:GITHUB_ENV "GST_TOP_DIR=$root\gstreamer"
          Add-Content $env:GITHUB_ENV "FFMPEG_TOP_DIR=$root\ffmpeg"
          Add-Content $env:GITHUB_ENV "NCNN_TOP_DIR=$root\ncnn"

      # Sets up the MSVC x64 toolchain and exports the VS dev-env vars (incl.
      # VSCMD_ARG_TGT_ARCH=x64, which build_installers.py checks for).
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Download VC++ redistributable
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://aka.ms/vs/17/release/vc_redist.x64.exe `
            -OutFile "${{ github.workspace }}\vc_redist.x64.exe"

      # The Revere installer only: the cloud installer is packed by package-cloud,
      # after the sign job has signed its plugin's manifest.
      - name: Build installers
        shell: pwsh
        env:
          REVERE_DIR: ${{ github.workspace }}\revere
          REVERE_CLOUD_DIR: ${{ github.workspace }}\revere_cloud
          REVERE_RELEASES_DIR: ${{ github.workspace }}\artifacts
          VC_REDIST_PATH: ${{ github.workspace }}\vc_redist.x64.exe
          INNO_COMPILER: C:\Program Files (x86)\Inno Setup 6\ISCC.exe
          REVERE_REQUIRE_SIGNED_PLUGINS: ${{ env.REQUIRE_SIGNED_PLUGINS }}
        run: |
          python revere\scripts\windows\build_installers.py --clean --no-cloud-installer

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installers
          path: artifacts/*.exe
          if-no-files-found: error

      # The staged plugin, exactly as the cloud installer packs it, and its manifest.
      - name: Write the cloud plugin's manifest
        shell: bash
        run: |
          set -euo pipefail
          version="$(git -C revere describe --tags --match 'v[0-9]*' --always)"
          python revere/scripts/release/write_plugin_manifest.py \
            --plugin revere/build/stage/revere/system_plugins/revere_cloud_system_plugin.dll \
            --version "${version#v}" --platform windows --arch x86_64 --asset-platform windows \
            --out cloud
          mkdir -p cloud-icon
          cp revere/build/stage/revere/R.ico cloud-icon/

      - name: Upload the cloud plugin and its manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-plugin-windows
          path: cloud/*
          if-no-files-found: error

      - name: Upload the cloud installer's icon
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-cloud-icon
          path: cloud-icon/R.ico
          if-no-files-found: error

  # Signs the cloud plugin's manifest (project-planning docs/IN_APP_PLUGIN_INSTALL.md,
  # section 2a). The only job that sees the signing key: it runs in the protected
  # `release` environment (v* tags only, after an approval from Tony or Scott),
  # checks out no code, runs no repo scripts, installs nothing, and uses only
  # GitHub's own actions. Shell tracing (set -x) stays off here.
  sign:
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
    steps:
      - name: Download the plugin and its manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cloud-plugin-windows
          merge-multiple: true
          path: plugin

      - name: Check each plugin against its manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          shopt -s nullglob
          manifests=(plugin/*.json)
          if [ ${#manifests[@]} -eq 0 ]; then echo "::error::no plugin manifests to sign"; exit 1; fi
          for m in "${manifests[@]}"; do
            p="${m%.json}"
            if [ ! -f "$p" ]; then echo "::error::no plugin beside $m"; exit 1; fi
            if [ "$(jq -r .format "$m")" != "1" ]; then echo "::error::$m isn't a format 1 manifest"; exit 1; fi
            if [ "$(jq -r .revere_version "$m")" != "$version" ]; then echo "::error::$m is for revere $(jq -r .revere_version "$m"), not $version"; exit 1; fi
            if [ "$(jq -r .size "$m")" != "$(stat -c %s "$p")" ]; then echo "::error::$p isn't the size $m says"; exit 1; fi
            if [ "$(jq -r .sha256 "$m")" != "$(sha256sum "$p" | cut -d' ' -f1)" ]; then echo "::error::$p isn't the file $m describes"; exit 1; fi
            echo "OK: $p"; cat "$m"; echo
          done

      - name: Sign each manifest
        env:
          SIGNING_KEY: ${{ secrets.REVERE_PLUGIN_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/plugin_signing_key.pem"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          # The secret must be the key revere trusts, or every plugin it signs is refused.
          printf '%s\n' "$TRUSTED_PLUGIN_KEY" > "$RUNNER_TEMP/trusted_key.pem"
          if ! cmp -s <(openssl pkey -in "$key" -pubout -outform DER) <(openssl pkey -pubin -in "$RUNNER_TEMP/trusted_key.pem" -outform DER); then
            echo "::error::REVERE_PLUGIN_SIGNING_KEY isn't the key in TRUSTED_PLUGIN_KEY (and r_vss::trusted_plugin_keys())"
            exit 1
          fi
          for m in plugin/*.json; do
            openssl dgst -sha256 -sign "$key" -out "$m.sig" "$m"
            openssl dgst -sha256 -verify "$RUNNER_TEMP/trusted_key.pem" -signature "$m.sig" "$m"
          done

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/plugin_signing_key.pem"

      - name: Upload the signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-signatures
          path: plugin/*.json.sig
          if-no-files-found: error

  # Packs the cloud installer around the plugin, its manifest and (on tag builds)
  # the signature, so a manual install passes the same checks as an in-app one.
  package-cloud:
    needs: [build-windows, sign]
    if: always() && needs.build-windows.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: windows-latest
    steps:
      - name: Checkout revere_cloud (its installer script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dicroce/revere_cloud
          ref: ${{ needs.build-windows.outputs.cloud_ref }}
          path: revere_cloud
          token: ${{ secrets.REVERE_CLOUD_TOKEN }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Download the plugin and its manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloud-plugin-windows
          path: plugin

      - name: Download the signature
        if: needs.sign.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloud-signatures
          path: plugin

      - name: Download the installer's icon
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-cloud-icon
          path: stage

      - name: Pack the cloud installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = Get-ChildItem plugin -Filter '*-cloud-plugin.dll' | Select-Object -First 1
          if (-not $asset) { throw 'no cloud plugin' }
          $version = (Get-Content "$($asset.FullName).json" -Raw | ConvertFrom-Json).revere_version
          New-Item -ItemType Directory -Force -Path stage\system_plugins, dist | Out-Null
          $name = 'revere_cloud_system_plugin.dll'
          Copy-Item $asset.FullName "stage\system_plugins\$name"
          foreach ($suffix in '.json', '.json.sig') {
            if (Test-Path "$($asset.FullName)$suffix") { Copy-Item "$($asset.FullName)$suffix" "stage\system_plugins\$name$suffix" }
          }
          Get-ChildItem stage -Recurse | Select-Object FullName, Length
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/O$PWD\out" "/DStagingDir=$PWD\stage" revere_cloud\RevereCloudSetup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Move-Item out\RevereCloudSetup.exe "dist\revere-v$version-windows-cloud-setup.exe"
          Copy-Item plugin\* dist\
          Get-ChildItem dist

      - name: Upload the cloud installer and plugin assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-cloud-assets
          path: dist/*
          if-no-files-found: error

  # Only runs for tag pushes. Gathers the built installers and attaches them to
  # a PUBLIC GitHub Release on this repo (published immediately — in-app download
  # links are live the moment this job finishes). The version guard above
  # prevents publishing assets whose names don't match the tag.
  release:
    permissions:
      contents: write
    needs: [build-windows, package-cloud]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installers
          path: dist

      - name: Download the cloud installer and plugin assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-cloud-assets
          path: dist

      - name: Verify installer versions match the tag
        shell: bash
        run: |
          set -euo pipefail
          # Tag is refs/tags/vX.Y.Z; the installers must be named with that exact
          # version, or the in-app download URL (which is built from the binary's
          # baked-in version) would point at assets that don't exist.
          tag="${GITHUB_REF_NAME}"            # e.g. v0.0.1
          version="${tag#v}"                  # e.g. 0.0.1
          echo "Tag: $tag  ->  expected version: $version"
          echo "Built installers:"; ls -1 dist
          for kind in app cloud; do
            expected="revere-v${version}-windows-${kind}-setup.exe"
            if [ ! -f "dist/${expected}" ]; then
              echo "::error::Expected installer '${expected}' not found. The build's"
              echo "::error::git-derived version does not match tag '${tag}'. Refusing"
              echo "::error::to release, or in-app download links would be dead."
              exit 1
            fi
          done
          echo "Version guard passed: both installers match $tag."
          # The in-app install's assets (libs/r_vss/r_plugin_installer.h), signed.
          for suffix in "" .json .json.sig; do
            expected="revere-v${version}-windows-cloud-plugin.dll${suffix}"
            if [ ! -f "dist/${expected}" ]; then
              echo "::error::Expected '${expected}' not found: the in-app Revere Cloud install would fail."
              exit 1
            fi
          done

      - name: Create/update public release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Create the release if missing. The Linux workflow's release job races
          # us for the same tag, so tolerate "already exists": create may fail
          # because the other job won — then just confirm it now exists.
          if ! gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "$tag" --repo "${GITHUB_REPOSITORY}" --title "$tag" --generate-notes \
              || gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1
          fi
          # Per-asset upload with --clobber is concurrency-safe (each platform's
          # job uploads distinct filenames).
          gh release upload "$tag" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          echo "Published release $tag with Windows installers and the cloud plugin."
