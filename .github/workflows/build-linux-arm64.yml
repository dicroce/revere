name: Build & Release Linux arm64

# arm64 Linux (Raspberry Pi 4/5 and other Debian-based boards), as a .deb plus
# the arm64 cloud .run. Same triggers as the other platforms:
#   - push of a v* tag  -> build AND attach both to the PUBLIC GitHub Release
#   - workflow_dispatch -> build only (assets named with the short git hash)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default; only the release job writes (it creates the Release and uploads assets).
permissions:
  contents: read

env:
  # The public half of the plugin signing key: the same key as
  # r_vss::trusted_plugin_keys() (libs/r_vss/source/r_plugin_manifest.cpp). The sign
  # job refuses a REVERE_PLUGIN_SIGNING_KEY secret that isn't its private half.
  TRUSTED_PLUGIN_KEY: |
    -----BEGIN PUBLIC KEY-----
    MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEyoJaveiI9dV8iMd1BCuTJ5waLQlE
    Lb/o4EjKncI5WScnbgqhP/t4XoNJxwdCaXcnMAEmMUy733L4laq3PEZGhg==
    -----END PUBLIC KEY-----
  # Release tag builds load only signed system plugins (r_vss/r_system_plugin_host.h).
  REQUIRE_SIGNED_PLUGINS: ${{ startsWith(github.ref, 'refs/tags/') && 'ON' || 'OFF' }}
  # NCNN is built from source (not in apt) and cached. Bump to rebuild.
  NCNN_VERSION: "20240820"
  # revere's own LGPL FFmpeg (scripts/linux/build_ffmpeg_lgpl.sh), cached and
  # shipped in the .deb. The same release line as the other platforms.
  FFMPEG_VERSION: n8.1.3
  OPENH264_VERSION: v2.6.0

jobs:
  build-linux-arm64:
    # Raspberry Pi OS is Debian. Building in bookworm (glibc 2.36, FFmpeg 5.1,
    # GStreamer 1.22) gives a .deb whose dpkg-shlibdeps dependencies install on
    # Pi OS bookworm and later; Ubuntu 24.04's newer libraries would not.
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm

    steps:
      # Before checkout: without git in the container, actions/checkout falls
      # back to a tarball, and the build's version comes from git describe.
      - name: Install build dependencies
        run: |
          apt-get update
          # No distro FFmpeg (Debian's is a GPL build), gstreamer1.0-libav
          # (links it) or plugins-ugly (x264enc): see "Build FFmpeg". libwebp
          # and libopus are for that build.
          apt-get install -y --no-install-recommends \
            build-essential cmake git pkg-config patchelf file \
            ca-certificates curl zstd binutils \
            libwebp-dev libopus-dev \
            libopencv-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            libssl-dev libsqlite3-dev uuid-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libgtk-3-dev libayatana-appindicator3-dev libcairo2-dev \
            libasound2-dev libpulse-dev
          # The workspace isn't owned by the container's root user.
          git config --global --add safe.directory '*'

      - name: Checkout revere
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: revere
          fetch-depth: 0

      # Version-lock revere_cloud to the tag on tag builds (same policy as the
      # other platforms). For workflow_dispatch this resolves to main. curl, not
      # gh: the bookworm container has no gh.
      - name: Determine revere_cloud ref
        id: cloudref
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REVERE_CLOUD_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            if curl -sf -o /dev/null -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/dicroce/revere_cloud/git/ref/tags/${tag}"; then
              echo "ref=${tag}" >> "$GITHUB_OUTPUT"
            else
              echo "::error::revere_cloud is missing tag '${tag}'. Tag it too:"
              echo "::error::(cd revere_cloud && git tag ${tag} && git push origin ${tag})"
              exit 1
            fi
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout revere_cloud
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dicroce/revere_cloud
          ref: ${{ steps.cloudref.outputs.ref }}
          path: revere_cloud
          fetch-depth: 0
          token: ${{ secrets.REVERE_CLOUD_TOKEN }}

      # Static NCNN, linked into the yolox plugin: a .deb has no linuxdeploy
      # step to bundle a shared libncnn the way the AppImage does.
      - name: Restore cached NCNN
        id: cache-ncnn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ncnn-install
          key: ncnn-arm64-bookworm-static-${{ env.NCNN_VERSION }}

      - name: Build NCNN (cache miss only)
        if: steps.cache-ncnn.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${NCNN_VERSION}" https://github.com/Tencent/ncnn.git
          cmake -S ncnn -B ncnn-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/ncnn-install" \
            -DNCNN_BUILD_TOOLS=OFF -DNCNN_BUILD_EXAMPLES=OFF \
            -DNCNN_BUILD_TESTS=OFF -DNCNN_BUILD_BENCHMARK=OFF \
            -DNCNN_SHARED_LIB=OFF -DNCNN_VULKAN=OFF
          cmake --build ncnn-build --parallel "$(nproc)"
          cmake --install ncnn-build

      # FFmpeg, LGPL. The closed Revere Cloud and HomeKit plugins load into
      # revere's process, and Debian's FFmpeg is a GPL build, so the .deb ships
      # revere's own in /opt/revere (the CMake install copies FFMPEG_TOP_DIR's
      # libraries there) rather than depending on Debian's. Bump the key's -vN
      # when the script changes.
      - name: Restore cached FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ffmpeg-lgpl
          key: ffmpeg-lgpl-${{ env.FFMPEG_VERSION }}-openh264-${{ env.OPENH264_VERSION }}-bookworm-arm64-v1

      - name: Build FFmpeg (LGPL, cache miss only)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: bash
        run: bash revere/scripts/linux/build_ffmpeg_lgpl.sh "${GITHUB_WORKSPACE}/ffmpeg-lgpl"

      - name: Use the LGPL FFmpeg
        shell: bash
        run: echo "FFMPEG_TOP_DIR=${GITHUB_WORKSPACE}/ffmpeg-lgpl" >> "$GITHUB_ENV"

      # PORTABLE: no -march=native, which would target the runner's CPU and
      # could use instructions a Pi's Cortex-A72/A76 doesn't have.
      - name: Configure
        run: |
          cmake -S revere -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DREVERE_PORTABLE_BUILD=ON \
            -DEXTERNAL_PLUGIN_REPOS="${GITHUB_WORKSPACE}/revere_cloud" \
            -DREVERE_REQUIRE_SIGNED_PLUGINS="${REQUIRE_SIGNED_PLUGINS}"
        env:
          NCNN_TOP_DIR: ${{ github.workspace }}/ncnn-install

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      # The release version: the tag on tag builds (e.g. v0.0.22), else the
      # short git hash (workflow_dispatch test builds).
      - name: Determine version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ver="${GITHUB_REF_NAME}"            # already vX.Y.Z
          else
            ver="v$(git -C revere rev-parse --short HEAD)"
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "Version: $ver"

      - name: Stage release assets (.deb)
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.ver }}"
          mkdir -p dist
          VERSION="$ver" \
          REVERE_BUILD_DIR="${GITHUB_WORKSPACE}/build" \
          REVERE_RELEASES_DIR="${GITHUB_WORKSPACE}/dist" \
          bash revere/scripts/linux/build_deb.sh
          echo "=== dist/ ==="; ls -la dist

      # The cloud .run is packed by package-cloud, after the sign job.
      # The built plugin, exactly as the cloud .run packs it, and its manifest.
      - name: Write the cloud plugin's manifest
        run: |
          set -euo pipefail
          version="$(git -C revere describe --tags --match 'v[0-9]*' --always)"
          python3 revere/scripts/release/write_plugin_manifest.py \
            --plugin "${GITHUB_WORKSPACE}/build/system_plugins/revere_cloud_system_plugin.so" \
            --version "${version#v}" --platform linux --arch arm64 --asset-platform linux-arm64 \
            --out cloud

      - name: Upload the cloud plugin and its manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-plugin-linux-arm64
          path: cloud/*
          if-no-files-found: error


      # Install the .deb the way a user would (apt resolves its Depends), then
      # run it headless: it must stay up and serve the web UI.
      - name: Smoke test
        shell: bash
        run: |
          set -uo pipefail
          apt-get install -y ./dist/revere-*-linux-arm64.deb
          mkdir -p /tmp/revere-data/secret
          cd /opt/revere
          timeout --preserve-status 20s ./revere --headless \
            --data-dir /tmp/revere-data --secret-dir /tmp/revere-data/secret > /tmp/revere_run.log 2>&1 &
          app=$!
          web=000
          for i in $(seq 1 30); do
            web="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/ || true)"
            [ "$web" = "200" ] && break
            sleep 0.5
          done
          wait "$app"; rc=$?
          echo "=== BEGIN app output ==="; cat /tmp/revere_run.log; echo "=== END app output ==="
          echo "web UI: $web, exit: $rc"
          # 143 = still running when timeout sent SIGTERM; it exits 0 on SIGTERM.
          case "$rc" in
            0|143) ;;
            *) echo "::error::revere exited abnormally (rc=$rc)"; exit 1;;
          esac
          [ "$web" = "200" ] || { echo "::error::web UI did not answer (got $web)"; exit 1; }
          echo "smoke test OK"

      # The .deb must carry exactly one FFmpeg, revere's LGPL build, and must not
      # depend on Debian's (GPL) FFmpeg or on gst-libav.
      - name: Verify the packaged FFmpeg is LGPL
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          deb="$(ls dist/revere-*-linux-arm64.deb)"
          depends="$(dpkg-deb -f "$deb" Depends)"
          echo "=== Depends ==="; echo "$depends" | tr ',' '\n'
          if echo "$depends" | grep -qE 'libav(codec|format|util)|libsw(scale|resample)|libpostproc|gstreamer1.0-libav'; then
            echo "::error::the .deb depends on Debian's FFmpeg or gst-libav"; fail=1
          fi
          echo "=== FFmpeg in the package ==="
          dpkg-deb -c "$deb" | grep -E 'lib(av|sw|postproc)' || true
          # One FFmpeg: every libavcodec file (the install may copy the .so
          # symlinks as files) is soname 62, ours, and each is the LGPL build.
          mapfile -t avcodec < <(find /opt/revere -type f -name 'libavcodec.so*')
          [ "${#avcodec[@]}" -ge 1 ] || { echo "::error::no libavcodec in /opt/revere"; fail=1; }
          majors="$(printf '%s\n' "${avcodec[@]}" | sed -nE 's/.*libavcodec\.so\.([0-9]+).*/\1/p' | sort -u | tr '\n' ' ')"
          echo "libavcodec majors: $majors"
          [ "$majors" = "62 " ] || { echo "::error::libavcodec majors '$majors' in /opt/revere (expected only 62)"; fail=1; }
          for lib in "${avcodec[@]}"; do
            # grep -a on the file, not strings | grep -q (fails under pipefail).
            grep -aq "LGPL version 2.1 or later" "$lib" || { echo "::error::$lib isn't revere's LGPL build"; fail=1; }
          done
          # What the installed revere actually loads.
          ldd /opt/revere/revere | grep -E 'lib(av|sw)' || true
          if ldd /opt/revere/revere | grep -E 'lib(av|sw)' | grep -qv '/opt/revere/'; then
            echo "::error::revere loads an FFmpeg library from outside /opt/revere"; fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "OK: one LGPL FFmpeg in the .deb, no dependency on Debian's"

      - name: Upload Linux arm64 assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-arm64-assets
          path: dist/*
          if-no-files-found: error

  # Signs the cloud plugin's manifest (project-planning docs/IN_APP_PLUGIN_INSTALL.md,
  # section 2a). The only job that sees the signing key: it runs in the protected
  # `release` environment (v* tags only, after an approval from Tony or Scott),
  # checks out no code, runs no repo scripts, installs nothing, and uses only
  # GitHub's own actions. Shell tracing (set -x) stays off here.
  sign:
    needs: [build-linux-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
    steps:
      - name: Download the plugin and its manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cloud-plugin-linux-arm64
          merge-multiple: true
          path: plugin

      - name: Check each plugin against its manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          shopt -s nullglob
          manifests=(plugin/*.json)
          if [ ${#manifests[@]} -eq 0 ]; then echo "::error::no plugin manifests to sign"; exit 1; fi
          for m in "${manifests[@]}"; do
            p="${m%.json}"
            if [ ! -f "$p" ]; then echo "::error::no plugin beside $m"; exit 1; fi
            if [ "$(jq -r .format "$m")" != "1" ]; then echo "::error::$m isn't a format 1 manifest"; exit 1; fi
            if [ "$(jq -r .revere_version "$m")" != "$version" ]; then echo "::error::$m is for revere $(jq -r .revere_version "$m"), not $version"; exit 1; fi
            if [ "$(jq -r .size "$m")" != "$(stat -c %s "$p")" ]; then echo "::error::$p isn't the size $m says"; exit 1; fi
            if [ "$(jq -r .sha256 "$m")" != "$(sha256sum "$p" | cut -d' ' -f1)" ]; then echo "::error::$p isn't the file $m describes"; exit 1; fi
            echo "OK: $p"; cat "$m"; echo
          done

      - name: Sign each manifest
        env:
          SIGNING_KEY: ${{ secrets.REVERE_PLUGIN_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/plugin_signing_key.pem"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          # The secret must be the key revere trusts, or every plugin it signs is refused.
          printf '%s\n' "$TRUSTED_PLUGIN_KEY" > "$RUNNER_TEMP/trusted_key.pem"
          if ! cmp -s <(openssl pkey -in "$key" -pubout -outform DER) <(openssl pkey -pubin -in "$RUNNER_TEMP/trusted_key.pem" -outform DER); then
            echo "::error::REVERE_PLUGIN_SIGNING_KEY isn't the key in TRUSTED_PLUGIN_KEY (and r_vss::trusted_plugin_keys())"
            exit 1
          fi
          for m in plugin/*.json; do
            openssl dgst -sha256 -sign "$key" -out "$m.sig" "$m"
            openssl dgst -sha256 -verify "$RUNNER_TEMP/trusted_key.pem" -signature "$m.sig" "$m"
          done

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/plugin_signing_key.pem"

      - name: Upload the signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-signatures
          path: plugin/*.json.sig
          if-no-files-found: error

  # Packs the cloud .run around the plugin, its manifest and (on tag builds) the
  # signature, so a manual install passes the same checks as an in-app one. Only
  # bash and tar: no build environment needed.
  package-cloud:
    needs: [build-linux-arm64, sign]
    if: always() && needs.build-linux-arm64.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout revere (its installer script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: revere

      - name: Download the plugin and its manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloud-plugin-linux-arm64
          path: plugin

      - name: Download the signature
        if: needs.sign.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloud-signatures
          path: plugin

      - name: Pack the cloud .run
        run: |
          set -euo pipefail
          asset="$(ls plugin/*-cloud-plugin.so | head -1)"
          version="$(jq -r .revere_version "$asset.json")"
          mkdir -p dist
          VERSION="v$version" \
          REVERE_CLOUD_ARCH=arm64 \
          REVERE_CLOUD_PLUGIN_PATH="$asset" \
          REVERE_RELEASES_DIR="${GITHUB_WORKSPACE}/dist" \
          bash revere/scripts/linux/create_cloud_plugin_installer.sh
          cp plugin/* dist/
          echo "=== dist/ ==="; ls -la dist

      - name: Upload the cloud .run and plugin assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-arm64-cloud-assets
          path: dist/*
          if-no-files-found: error

  # Only runs for tag pushes. Attaches the .deb, the arm64 cloud .run and the
  # cloud plugin's assets to the PUBLIC GitHub Release for this tag (shared with
  # the other platforms).
  release:
    permissions:
      contents: write
    needs: [build-linux-arm64, package-cloud]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux arm64 assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-arm64-assets
          path: dist

      - name: Download the cloud .run and plugin assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-arm64-cloud-assets
          path: dist

      - name: Verify asset versions match the tag
        shell: bash
        run: |
          set -euo pipefail
          # The cloud .run name must contain the tag's version, or the in-app
          # "Download Revere Cloud" URL (built from the binary's baked-in version)
          # would 404. Guard both assets.
          tag="${GITHUB_REF_NAME}"; version="${tag#v}"
          echo "Tag: $tag  -> expected version: $version"
          echo "Built assets:"; ls -1 dist
          for expected in "revere-v${version}-linux-arm64.deb" "revere-v${version}-linux-arm64-cloud.run"; do
            if [ ! -f "dist/${expected}" ]; then
              echo "::error::Expected asset '${expected}' not found — refusing to release"
              echo "::error::(would leave dead in-app download links)."
              exit 1
            fi
          done
          echo "Version guard passed: both Linux arm64 assets match $tag."
          # The in-app install's assets (libs/r_vss/r_plugin_installer.h), signed.
          for suffix in "" .json .json.sig; do
            expected="revere-v${version}-linux-arm64-cloud-plugin.so${suffix}"
            if [ ! -f "dist/${expected}" ]; then
              echo "::error::Expected '${expected}' not found: the in-app Revere Cloud install would fail."
              exit 1
            fi
          done

      - name: Create/update public release and upload Linux arm64 assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Create the release if missing. The other platforms' release jobs race
          # us for the same tag, so tolerate "already exists".
          if ! gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "$tag" --repo "${GITHUB_REPOSITORY}" --title "$tag" --generate-notes \
              || gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1
          fi
          # Distinct filenames per platform → concurrent --clobber uploads are safe.
          gh release upload "$tag" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          echo "Published Linux arm64 assets to release $tag."
