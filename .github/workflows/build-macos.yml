name: Build & Release macOS

# Two triggers (mirrors Windows/Linux):
#   - push of a v* tag  -> build AND attach the .dmg + cloud .command to the
#                          PUBLIC GitHub Release for that tag
#   - workflow_dispatch -> build only (assets named with the short git hash)
#
# Two builds, unsigned (users clear quarantine):
#   - Apple Silicon (arm64) on macos-15: revere-<ver>-macos-app.dmg and
#     revere-<ver>-macos-cloud.command, the names earlier releases used.
#   - Intel (x86_64) on macos-15-intel: revere-<ver>-macos-intel-app.dmg and
#     revere-<ver>-macos-intel-cloud.command.
# Each sets its minimum macOS (min_macos) as the deployment target, and "Verify
# the minimum macOS and architecture" fails the build if anything bundled needs
# a newer one, so the minimum is the one stated here, not the runner's.
#
# The minimum can't be below what the Homebrew bottles were built for: arm64
# bottles on macos-15 are Sequoia's (15). Homebrew bottles only its three newest
# supported macOS versions; on an older runner it compiles every updated formula
# (llvm, vtk, opencv, ...) and the job hits the 6-hour limit in brew install, as
# macos-14 did from v0.0.30 on.
#
# Intel: Homebrew stopped building Intel bottles in 2026 (Intel macOS is its
# Tier 3), and its last ones are Sonoma's (14). Today's formulae mostly have
# none, so brew would compile opencv, gstreamer, vtk, qt, ... from source. The
# Intel build pins Homebrew and homebrew-core (brew_version, brew_core_pin) to
# August 2026, when every formula revere needs still had a Sonoma bottle. Its
# dependencies stay at those versions; move the pin only to a commit whose whole
# dependency tree still has Intel bottles.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # revere's own FFmpeg (see "Build FFmpeg"): the same release line as the
  # Windows deps (BtbN n8.1 lgpl-shared). Bump to rebuild.
  FFMPEG_VERSION: n8.1.3

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            min_macos: '15.0'
            asset: macos           # revere-<ver>-macos-app.dmg, as before
            brew_version: ''       # current Homebrew
            brew_core_pin: ''
            extra_brew: ''
          - arch: x86_64
            runner: macos-15-intel
            min_macos: '14.0'
            asset: macos-intel     # revere-<ver>-macos-intel-app.dmg
            brew_version: '6.0.17'                                       # 11 Aug 2026
            brew_core_pin: 'fbb6990e8a9d2d0409e14eb9d0c6d728ddf4b1ab'   # homebrew-core, 14 Aug 2026
            extra_brew: 'nasm'     # FFmpeg's x86 assembly
    runs-on: ${{ matrix.runner }}
    env:
      # Read by clang and by FFmpeg's configure: the oldest macOS the binaries run on.
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.min_macos }}

    steps:
      - name: Checkout revere
        uses: actions/checkout@v4
        with:
          path: revere
          fetch-depth: 0

      # Version-lock revere_cloud to the tag on tag builds (same policy as the
      # other platforms). For workflow_dispatch this resolves to main.
      - name: Determine revere_cloud ref
        id: cloudref
        env:
          GH_TOKEN: ${{ secrets.REVERE_CLOUD_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            if gh api "repos/dicroce/revere_cloud/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "ref=${tag}" >> "$GITHUB_OUTPUT"
            else
              echo "::error::revere_cloud is missing tag '${tag}'. Tag it too:"
              echo "::error::(cd revere_cloud && git tag ${tag} && git push origin ${tag})"
              exit 1
            fi
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout revere_cloud
        uses: actions/checkout@v4
        with:
          repository: dicroce/revere_cloud
          ref: ${{ steps.cloudref.outputs.ref }}
          path: revere_cloud
          fetch-depth: 0
          token: ${{ secrets.REVERE_CLOUD_TOKEN }}

      # The Intel build's pinned Homebrew (see the top of this file): brew and
      # homebrew-core at fixed commits, formulae read from the tap rather than the
      # API (which is today's), and nothing updated behind our back.
      - name: Pin Homebrew (Intel)
        if: matrix.brew_core_pin != ''
        run: |
          set -euo pipefail
          {
            echo "HOMEBREW_NO_AUTO_UPDATE=1"
            echo "HOMEBREW_NO_INSTALL_FROM_API=1"
            echo "HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1"
            echo "HOMEBREW_NO_INSTALL_UPGRADE=1"
          } >> "$GITHUB_ENV"
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_FROM_API=1
          brew_repo="$(brew --repository)"
          git -C "$brew_repo" fetch --quiet --tags origin
          git -C "$brew_repo" checkout --quiet "${{ matrix.brew_version }}"
          brew tap --force homebrew/core
          core="$(brew --repository homebrew/core)"
          git -C "$core" fetch --quiet origin "${{ matrix.brew_core_pin }}"
          git -C "$core" checkout --quiet "${{ matrix.brew_core_pin }}"
          brew --version
          git -C "$core" log -1 --format='homebrew-core %H %cI'

      - name: Install dependencies
        run: |
          set -euo pipefail
          # The pinned Intel Homebrew stays where it is.
          [ -n "${{ matrix.brew_core_pin }}" ] || brew update
          # Runtime/build deps via Homebrew. ncnn is in brew (arm64) so the
          # yolov8 plugin builds without a from-source NCNN. dylibbundler gathers
          # the non-system dylibs into the .app and rewrites their load paths.
          # FFmpeg is NOT Homebrew's (see "Build FFmpeg"); openh264, webp and
          # opus are for that build.
          brew install \
            cmake pkg-config dylibbundler \
            opencv \
            gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad \
            glfw sqlite ncnn \
            openh264 webp opus \
            ${{ matrix.extra_brew }}
          # Homebrew's opencv and gstreamer still pull in its ffmpeg, a GPL build
          # (x264/x265). Unlink it so its headers, libs and .pc files leave the
          # Homebrew prefix: nothing can build or link against it by accident.
          # (Homebrew's own libs keep loading it by its keg path.)
          brew unlink ffmpeg || true
          # Our FFmpeg links these by versioned name, so a cached build is only
          # good for the versions it was built against.
          echo "FFMPEG_DEPS_KEY=$(brew list --versions openh264 webp opus | tr ' \n' '-_')" >> "$GITHUB_ENV"
          # Make sure pkg-config sees the Homebrew prefix (/opt/homebrew or /usr/local).
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig" >> "$GITHUB_ENV"

      # FFmpeg, LGPL. The closed Revere Cloud and HomeKit plugins load into
      # revere's process, so revere must not bundle a GPL FFmpeg, and Homebrew's
      # is one. Build our own instead, cached by version. Without --enable-gpl or
      # --enable-nonfree configure refuses every GPL/nonfree component, so the
      # result is LGPL whatever it autodetects. Bump the key's -vN when the
      # configure line changes.
      - name: Restore cached FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ffmpeg-lgpl
          key: ffmpeg-lgpl-${{ env.FFMPEG_VERSION }}-macos-${{ matrix.arch }}-min${{ matrix.min_macos }}-v1-${{ env.FFMPEG_DEPS_KEY }}

      - name: Build FFmpeg (LGPL, cache miss only)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${FFMPEG_VERSION}" https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          cd ffmpeg-src
          ./configure \
            --prefix="${GITHUB_WORKSPACE}/ffmpeg-lgpl" \
            --enable-shared --disable-static \
            --disable-programs --disable-doc --disable-debug \
            --disable-avdevice --disable-avfilter \
            --disable-sdl2 --disable-xlib --disable-libxcb \
            --enable-videotoolbox --enable-audiotoolbox \
            --enable-libopenh264 --enable-libwebp --enable-libopus \
            --extra-cflags="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" \
            --extra-ldflags="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}"
          grep -E "^#define CONFIG_(GPL|NONFREE) 0" config.h | wc -l | grep -q 2 || { echo "::error::FFmpeg configured with GPL or nonfree parts"; exit 1; }
          make -j"$(sysctl -n hw.ncpu)"
          make install
          ls -la "${GITHUB_WORKSPACE}/ffmpeg-lgpl/lib"

      - name: Use the LGPL FFmpeg
        run: echo "FFMPEG_TOP_DIR=${GITHUB_WORKSPACE}/ffmpeg-lgpl" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S revere -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DEXTERNAL_PLUGIN_REPOS="${GITHUB_WORKSPACE}/revere_cloud" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/macos-install" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ matrix.min_macos }}" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DNCNN_TOP_DIR="$(brew --prefix ncnn)"

      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Install (.app bundles)
        run: |
          set -euo pipefail
          cmake --install build
          echo "=== macos-install ==="; ls -la macos-install || true
          echo "=== Revere.app/Contents/MacOS ==="; ls -la "macos-install/Revere.app/Contents/MacOS" | head -40 || true

      # Ship the app CLOUD-FREE, matching Windows/Linux: the cloud plugin is
      # delivered SEPARATELY as the .command installer. The macOS CMake install
      # copies system_plugins/ into the .app, so remove it here (Linux does the
      # equivalent prune in its workflow). Leaving it in caused the app to ship
      # AND load a bundled cloud plugin in addition to any user-installed one.
      - name: Prune bundled cloud plugin (cloud-free app)
        run: |
          set -euo pipefail
          rm -rf "macos-install/Revere.app/Contents/MacOS/system_plugins"
          echo "system_plugins after prune (should be gone):"
          ls -la "macos-install/Revere.app/Contents/MacOS/system_plugins" 2>&1 || echo "(removed)"

      # Gather non-system dylibs (OpenCV/GStreamer/FFmpeg/ncnn/glib/...) into the
      # app bundle and rewrite install names to @executable_path/../lib so the
      # .dmg runs on a machine WITHOUT Homebrew. This is the macOS analog of
      # linuxdeploy. Run for the main executables; -x adds the dlopen'd plugins
      # (motion + system) whose deps would otherwise be missed.
      - name: Bundle dylibs into Revere.app
        run: |
          set -euo pipefail
          app="macos-install/Revere.app"
          macos="$app/Contents/MacOS"
          libdir="$app/Contents/libs"
          extra=()
          while IFS= read -r so; do extra+=( -x "$so" ); done < <(find "$macos" \( -name '*.dylib' -o -name '*.so' \) -type f)
          dylibbundler -cd -b \
            -x "$macos/revere" \
            "${extra[@]}" \
            -d "$libdir" \
            -p "@executable_path/../libs/"
          echo "=== bundled libs ==="; ls -la "$libdir" | head -40 || true

      # Vision.app needs the same treatment as Revere.app: the CMake install
      # copies project dylibs into it but its OpenCV/GStreamer/etc deps still
      # point at /opt/homebrew (would fail to load on a user Mac). Bundle them
      # into Vision.app/Contents/libs too. (Without this Vision also can't load
      # its deps even once the signature is fixed below.)
      - name: Bundle dylibs into Vision.app
        run: |
          set -euo pipefail
          app="macos-install/Vision.app"
          if [ ! -d "$app" ]; then echo "Vision.app not present; skipping"; exit 0; fi
          macos="$app/Contents/MacOS"
          libdir="$app/Contents/libs"
          extra=()
          while IFS= read -r so; do extra+=( -x "$so" ); done < <(find "$macos" \( -name '*.dylib' -o -name '*.so' \) -type f)
          dylibbundler -cd -b \
            -x "$macos/vision" \
            "${extra[@]}" \
            -d "$libdir" \
            -p "@executable_path/../libs/"
          echo "=== Vision bundled libs ==="; ls -la "$libdir" | head -40 || true

      # Bundle GStreamer ELEMENT PLUGINS into Revere.app. These are dlopen'd by
      # GStreamer at runtime (rtspsrc, rtp*, decodebin, libav decoders, ...), so
      # they are NOT linked deps and dylibbundler never sees them — without this
      # the app has GStreamer's core libs but ZERO elements, and RTSP camera
      # interrogation fails with "Unable to fetch video stream information".
      # The app scans <exe dir>/gstreamer_plugins at startup (r_gst_source.cpp),
      # so install them to Revere.app/Contents/MacOS/gstreamer_plugins, then
      # rewrite each plugin's non-system deps to the bundled libs (same stem
      # resolution used for the cloud plugin: Homebrew dylibs use full versioned
      # names while plugins link short sonames). Finally dylibbundler -x over the
      # plugins catches any transitive lib the app didn't already bundle.
      # Bundle GStreamer element plugins into BOTH app bundles. On Windows/Linux
      # Revere and Vision live in one dir and share a single gstreamer_plugins
      # folder; on macOS they are separate .app bundles with isolated exe dirs
      # (r_gst_source.cpp scans <exe dir>/gstreamer_plugins), so each .app needs
      # its own copy or Vision logs "No plugins found" and streams won't play.
      - name: Bundle GStreamer plugins into app bundles
        run: |
          # NOT using `set -e`: this runs pipelines that legitimately exit nonzero
          # (grep no-match, etc.). Track failures explicitly via $fail.
          set -uo pipefail
          fail=0
          src="$(brew --prefix gstreamer)/lib/gstreamer-1.0"
          echo "PHASE: gstreamer source = $src"
          [ -d "$src" ] || { echo "::error::gstreamer plugin source dir not found: $src"; exit 1; }

          # CURATED set (matches the proven Windows list + what decodebin needs),
          # NOT the full 274. Homebrew splits GStreamer across formulae, so copying
          # every plugin pulls in ones (webrtc, etc.) whose backing libs aren't
          # installed -> dylibbundler then hangs on an interactive "can't find it"
          # prompt. We only need the RTSP/RTP ingest + parse/decode elements.
          # No libgstlibav: it links Homebrew's (GPL) FFmpeg. The Opus restream
          # decodes AAC with revere's own FFmpeg instead (restream_pcm).
          want="\
            libgstapp libgstcoreelements libgstrtp libgstrtpmanager libgstrtsp \
            libgsttcp libgstudp libgstsdpelem \
            libgstaudioparsers libgstvideoparsersbad \
            libgstplayback libgsttypefindfunctions libgstvideoconvertscale \
            libgstaudioconvert libgstaudioresample libgstopus libgstmulaw libgstalaw \
            libgstvideofilter libgstautodetect libgstvideorate"

          bundle_gst_plugins() {  # $1 = path to .app
            local app="$1"
            [ -d "$app" ] || { echo "PHASE: $app not present, skipping"; return 0; }
            local macos="$app/Contents/MacOS"
            local libdir="$app/Contents/libs"
            local plugdir="$macos/gstreamer_plugins"
            echo "PHASE: ===== bundling gstreamer plugins into $app ====="
            mkdir -p "$plugdir"

            local copied=0 missing="" name
            for name in $want; do
              if [ -e "$src/$name.dylib" ]; then
                cp -L "$src/$name.dylib" "$plugdir"/ && copied=$((copied+1))
              else
                missing="$missing $name"
              fi
            done
            # Homebrew dylibs are read-only (444); without this, install_name_tool
            # / dylibbundler / codesign get "Permission denied" and silently leave
            # /opt deps unfixed.
            chmod -R u+w "$plugdir"
            local n_copied
            n_copied=$(ls -1 "$plugdir"/*.dylib 2>/dev/null | wc -l | tr -d ' ')
            echo "PHASE: copied $n_copied curated plugins into $(basename "$app")"
            [ -n "$missing" ] && echo "::warning::curated plugins not present in brew gstreamer:$missing" || true
            [ "$n_copied" -gt 0 ] || { echo "::error::no gstreamer plugins copied into $app"; fail=1; return 1; }

            # Let dylibbundler do ALL dependency rewriting; -s points at the app's
            # already-bundled core libs so it finds them. </dev/null so a missing
            # dep can't drop it into an infinite interactive prompt in CI.
            local extra=()
            local so
            while IFS= read -r so; do extra+=( -x "$so" ); done < <(find "$plugdir" -name '*.dylib' -type f)
            dylibbundler -cd -b -of \
              "${extra[@]}" \
              -s "$libdir" \
              -d "$libdir" \
              -p "@executable_path/../libs/" </dev/null || echo "::warning::dylibbundler over $(basename "$app") plugins reported issues"

            # Rewrite each plugin's own install-id (line 1 of otool -L) off /opt.
            # Harmless either way (plugins load by path) but keeps the bundle clean.
            local p
            for p in "$plugdir"/*.dylib; do
              install_name_tool -id "@executable_path/../libs/gstreamer_plugins/$(basename "$p")" "$p" 2>/dev/null || true
            done

            # Verify DEPENDENCIES only (skip line 1 = the lib's own id via tail+2).
            local leftover=0
            for p in "$plugdir"/*.dylib; do
              if otool -L "$p" 2>/dev/null | tail -n +2 | grep -q "/opt/"; then
                echo "::warning::leftover /opt dependency in $(basename "$app")/$(basename "$p")"
                leftover=$((leftover+1))
              fi
            done
            echo "PHASE: $(basename "$app") plugins with leftover /opt dependencies = $leftover"
            if [ "$leftover" -gt 0 ]; then
              otool -L "$plugdir/libgstrtsp.dylib" 2>&1 || true
              echo "::error::$leftover plugin(s) in $app still have a /opt dependency"
              fail=1
            fi

            # install_name_tool invalidated signatures; re-sign ad-hoc.
            for p in "$plugdir"/*.dylib; do codesign --force --sign - "$p" || { echo "::error::codesign failed for $p"; fail=1; }; done
            echo "PHASE: $(basename "$app") gstreamer plugins bundled + signed ($n_copied)"
          }

          bundle_gst_plugins "macos-install/Revere.app"
          bundle_gst_plugins "macos-install/Vision.app"

          [ "$fail" -eq 0 ] || { echo "::error::gstreamer plugin bundling had failures"; exit 1; }
          echo "PHASE: gstreamer plugins bundled into all app bundles"

      # The bundles must carry exactly one FFmpeg, revere's LGPL build: no second
      # libavcodec (Homebrew's, by way of a GStreamer plugin or OpenCV) and no
      # GPL library or plugin.
      - name: Verify the bundled FFmpeg is LGPL
        run: |
          set -uo pipefail
          fail=0
          for app in macos-install/Revere.app macos-install/Vision.app; do
            [ -d "$app" ] || continue
            libdir="$app/Contents/libs"
            echo "=== $app: FFmpeg and codec libs ==="
            ls "$libdir" | grep -E '^lib(av|sw|postproc|x26|openh264)' || true
            n=$(ls "$libdir" | grep -c '^libavcodec')
            [ "$n" -eq 1 ] || { echo "::error::$app has $n libavcodec copies (expected 1)"; fail=1; }
            if ls "$libdir" | grep -qE '^lib(postproc|x264|x265)'; then
              echo "::error::$app bundles a GPL library"; fail=1
            fi
            if ls "$app/Contents/MacOS/gstreamer_plugins" 2>/dev/null | grep -qE '^libgst(libav|x264|x265)'; then
              echo "::error::$app bundles a GPL GStreamer plugin"; fail=1
            fi
            for lib in "$libdir"/libavcodec*.dylib; do
              # grep -a on the file, not strings | grep -q: with pipefail, grep
              # quitting early fails strings ("failed to flush output").
              grep -aq "LGPL version 2.1 or later" "$lib" || { echo "::error::$(basename "$lib") isn't revere's LGPL build"; fail=1; }
            done
            # Nothing may still load Homebrew's FFmpeg by its keg path.
            if find "$app" -type f -name '*.dylib' -exec otool -L {} \; 2>/dev/null | grep -q "/opt/ffmpeg/"; then
              echo "::error::something in $app links Homebrew's ffmpeg"; fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "OK: one LGPL FFmpeg per app bundle, no GPL libraries or plugins"

      # Every Mach-O in the bundles, and the cloud plugin, must be this build's
      # architecture and need no macOS newer than min_macos: a Homebrew dylib built
      # for a newer macOS would make the stated minimum untrue.
      - name: Verify the minimum macOS and architecture
        run: |
          set -uo pipefail
          want="${{ matrix.min_macos }}"
          arch="${{ matrix.arch }}"
          newer() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" != "$2" ]; }  # $1 newer than $2
          minos_of() {  # LC_BUILD_VERSION minos, or LC_VERSION_MIN_MACOSX version
            otool -l "$1" 2>/dev/null | awk '/LC_BUILD_VERSION/{b=1} /LC_VERSION_MIN_MACOSX/{v=1} b&&$1=="minos"{print $2; exit} v&&$1=="version"{print $2; exit}'
          }
          checked=0; bad=0
          plugin="$(find build -name 'revere_cloud_system_plugin.dylib' -type f | head -1)"
          while IFS= read -r f; do
            file -b "$f" | grep -q 'Mach-O' || continue
            checked=$((checked+1))
            archs="$(lipo -archs "$f" 2>/dev/null)"
            case " $archs " in *" $arch "*) ;; *) echo "::error::$f is $archs, not $arch"; bad=$((bad+1)); continue;; esac
            m="$(minos_of "$f")"
            if [ -z "$m" ]; then echo "::warning::no minimum macOS recorded in $f"; continue; fi
            if newer "$m" "$want"; then echo "::error::$f needs macOS $m (the build's minimum is $want)"; bad=$((bad+1)); fi
          done < <(find macos-install/Revere.app macos-install/Vision.app $plugin -type f 2>/dev/null)
          echo "checked $checked Mach-O files for $arch, macOS $want or older; $bad wrong"
          [ "$checked" -gt 0 ] || { echo "::error::no Mach-O files found to check"; exit 1; }
          [ "$bad" -eq 0 ] || exit 1

      - name: Determine version
        id: ver
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ver="${GITHUB_REF_NAME}"
          else
            ver="v$(git -C revere rev-parse --short HEAD)"
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "Version: $ver"

      # Re-sign both .app bundles AFTER all modifications. On Apple Silicon every
      # macho must carry a valid signature; the linker's automatic ad-hoc seal is
      # invalidated the moment we copy/rewrite dylibs into the bundle, which makes
      # macOS reject the app as "damaged and can't be opened". (Revere happened to
      # get re-signed as a side effect of dylibbundler; Vision did not -> it showed
      # "damaged".) Do an explicit deep ad-hoc re-sign of both as the final step.
      # NOTE: ad-hoc (-) only fixes the "damaged" rejection; it is NOT notarization
      # (users still clear quarantine on first open). Proper Developer ID signing
      # is a separate, later step.
      - name: Ad-hoc re-sign app bundles
        run: |
          set -euo pipefail
          for app in macos-install/Revere.app macos-install/Vision.app; do
            [ -d "$app" ] || continue
            echo "=== re-signing $app ==="
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --verbose=2 "$app" && echo "verify OK: $app"
          done

      # Build the .dmg directly with hdiutil (the repo's CPack DragNDrop config
      # references a background image + ds_store script that aren't in the repo).
      - name: Create .dmg
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.ver }}"
          mkdir -p dist dmgroot
          cp -R "macos-install/Revere.app" dmgroot/
          [ -d "macos-install/Vision.app" ] && cp -R "macos-install/Vision.app" dmgroot/ || true
          ln -s /Applications dmgroot/Applications
          # hdiutil intermittently fails with "Resource busy" on CI runners (disk
          # automount race), unrelated to bundle contents. Retry a few times.
          out="dist/revere-${ver}-${{ matrix.asset }}-app.dmg"
          ok=0
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname "Revere" -srcfolder dmgroot -ov -format UDBZ "$out"; then
              ok=1; break
            fi
            echo "hdiutil attempt $attempt failed (likely 'Resource busy'); retrying in 10s..."
            sleep 10
          done
          [ "$ok" -eq 1 ] || { echo "::error::hdiutil create failed after retries"; exit 1; }
          echo "=== dist ==="; ls -la dist

      # Rewrite the cloud plugin's dependency load-commands so it reuses the libs
      # ALREADY bundled in Revere.app/Contents/libs, instead of its build-time
      # /opt/homebrew/... paths (which don't exist on a user's Mac -> dlopen fails
      # -> "plugin doesn't load"). The plugin is dlopen'd by the running `revere`
      # executable, so @executable_path = Revere.app/Contents/MacOS and
      # @executable_path/../libs resolves to the app's bundled libs regardless of
      # where the plugin file itself sits (~/Library/Application Support/...).
      # Reusing the app's libs means the plugin loads ZERO extra dylibs — no
      # duplicate OpenCV/protobuf, so no descriptor-collision crash either.
      - name: Rewrite cloud plugin deps to the app bundle libs
        run: |
          set -euo pipefail
          plugin="$(find build -name 'revere_cloud_system_plugin.dylib' -type f | head -1)"
          if [ -z "$plugin" ]; then echo "::error::cloud plugin dylib not found"; exit 1; fi
          libdir="macos-install/Revere.app/Contents/libs"
          echo "=== plugin deps BEFORE rewrite ==="; otool -L "$plugin"

          # Map each dependency to the ACTUAL bundled filename. The plugin links
          # against SHORT sonames (libopencv_gapi.413.dylib, libavcodec.62.dylib)
          # but dylibbundler copies the symlink TARGETS under their full versioned
          # names (libopencv_gapi.4.13.0.dylib, libavcodec.62.28.101.dylib) and
          # does NOT recreate the short-name symlinks. So a naive basename repoint
          # lands on a file that isn't there. Resolve by library "stem" (the part
          # before the first version digit) to whatever the bundle actually has.
          resolve_bundled() {  # $1 = dep basename -> echoes bundled basename or empty
            local b="$1"
            if [ -e "$libdir/$b" ]; then echo "$b"; return; fi
            # stem = strip from the first ".<digit>" onward, e.g.
            #   libopencv_gapi.413.dylib   -> libopencv_gapi
            #   libavcodec.62.dylib        -> libavcodec
            local stem="${b%%.[0-9]*}"
            local m
            m="$(cd "$libdir" && ls -1 "${stem}".*.dylib "${stem}".dylib 2>/dev/null | head -1 || true)"
            echo "$m"
          }

          otool -L "$plugin" | tail -n +2 | awk '{print $1}' | while read -r dep; do
            case "$dep" in
              /usr/lib/*|/System/*|@executable_path/*|@rpath/*|@loader_path/*) continue;;
            esac
            base="$(basename "$dep")"
            target="$(resolve_bundled "$base")"
            if [ -z "$target" ]; then
              echo "::warning::no bundled lib matches plugin dep '$base' — leaving as-is"
              continue
            fi
            install_name_tool -change "$dep" "@executable_path/../libs/$target" "$plugin" || \
              echo "::warning::install_name_tool failed to change $dep"
          done
          echo "=== plugin deps AFTER rewrite ==="; otool -L "$plugin"
          echo "=== verify: no /opt/homebrew or /opt/ refs, and every @executable_path lib exists ==="
          bad=0
          otool -L "$plugin" | tail -n +2 | awk '{print $1}' | while read -r dep; do
            case "$dep" in
              /opt/*|/usr/local/*) echo "::warning::leftover external ref: $dep";;
              @executable_path/../libs/*)
                f="${dep#@executable_path/../libs/}"
                [ -e "$libdir/$f" ] || echo "::warning::dangling bundled ref (no such file): $dep";;
            esac
          done
          # install_name_tool invalidated the plugin's signature; re-sign ad-hoc or
          # dlopen can be rejected for a bad signature on arm64.
          codesign --force --sign - "$plugin"
          codesign --verify --verbose=2 "$plugin" && echo "plugin verify OK"

      # Cloud plugin .command (self-extracting, installs the dylib into
      # ~/Library/Application Support/Revere/revere/system_plugins). The plugin
      # was built in-tree against this run's libs via EXTERNAL_PLUGIN_REPOS; it
      # lands under build/_deps/revere_cloud-build/.
      - name: Create cloud .command
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.ver }}"
          plugin="$(find build -name 'revere_cloud_system_plugin.dylib' -type f | head -1)"
          if [ -z "$plugin" ]; then echo "::error::cloud plugin dylib not found"; exit 1; fi
          echo "plugin: $plugin"
          out="dist/revere-${ver}-${{ matrix.asset }}-cloud.command"
          echo '#!/bin/bash' > "$out"
          # The plugin only loads into a Revere of its own architecture.
          echo 'PLUGIN_ARCH="${{ matrix.arch }}"' >> "$out"
          cat >> "$out" <<'HDR'
          set -e
          PLUGIN_DIR="$HOME/Library/Application Support/Revere/revere/system_plugins"
          PLUGIN_NAME="revere_cloud_system_plugin.dylib"
          echo "Revere Cloud Plugin Installer"; echo "=============================="; echo ""
          if [ "$(uname -m)" != "$PLUGIN_ARCH" ]; then
            if [ "$PLUGIN_ARCH" = "x86_64" ]; then
              echo "Error: this installer is for Intel Macs. This Mac has Apple silicon: use revere-<version>-macos-cloud.command."
            else
              echo "Error: this installer is for Macs with Apple silicon. On an Intel Mac use revere-<version>-macos-intel-cloud.command."
            fi
            read -p "Press Enter to exit..."; exit 1
          fi
          if [ ! -d "$HOME/Library/Application Support/Revere/revere" ]; then
            echo "Error: Revere does not appear to be installed."
            echo "Please run Revere at least once before installing the plugin."
            read -p "Press Enter to exit..."; exit 1
          fi
          mkdir -p "$PLUGIN_DIR"
          ARCHIVE_START=$(awk '/^__PAYLOAD__$/{print NR + 1; exit 0; }' "$0")
          tail -n +"$ARCHIVE_START" "$0" > "$PLUGIN_DIR/$PLUGIN_NAME"
          chmod 755 "$PLUGIN_DIR/$PLUGIN_NAME"
          echo ""; echo "Installation complete! Restart Revere to load the cloud plugin."
          read -p "Press Enter to exit..."; exit 0
          __PAYLOAD__
          HDR
          cat "$plugin" >> "$out"
          chmod +x "$out"
          echo "=== dist ==="; ls -la dist

      # Light smoke check: confirm the bundled app has no unresolved non-system
      # dylib references (otool). A full GUI launch needs a display we don't have.
      - name: Smoke test (otool linkage)
        run: |
          set +e
          fail=0
          bin="macos-install/Revere.app/Contents/MacOS/revere"
          echo "=== otool -L $bin ==="; otool -L "$bin"
          # Any remaining /opt/homebrew or /usr/local references = unbundled dep.
          leaked="$(otool -L "$bin" | grep -E '/opt/homebrew|/usr/local/' || true)"
          if [ -n "$leaked" ]; then
            echo "::warning::executable still references Homebrew paths (dylibbundler may need -x for more libs):"
            echo "$leaked"
          fi
          echo "smoke check done (non-fatal this first cut)"
          exit 0

      - name: Upload macOS assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS assets
        uses: actions/download-artifact@v4
        with:
          pattern: macos-assets-*
          merge-multiple: true
          path: dist

      - name: Verify asset versions match the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"; version="${tag#v}"
          echo "Tag: $tag -> expected version: $version"; ls -1 dist
          for expected in "revere-v${version}-macos-app.dmg" "revere-v${version}-macos-cloud.command" \
                          "revere-v${version}-macos-intel-app.dmg" "revere-v${version}-macos-intel-cloud.command"; do
            if [ ! -f "dist/${expected}" ]; then
              echo "::error::Expected asset '${expected}' not found — refusing to release."
              exit 1
            fi
          done
          echo "Version guard passed: all four macOS assets match $tag."

      - name: Create/update public release and upload macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Shared per-tag Release; tolerate the cross-workflow create race.
          if ! gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "$tag" --repo "${GITHUB_REPOSITORY}" --title "$tag" --generate-notes \
              || gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1
          fi
          gh release upload "$tag" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          echo "Published macOS assets to release $tag."
