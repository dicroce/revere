name: Build Linux

# Manual-only while stabilizing. This first cut builds the app AppImage and
# smoke-tests it. Once green, follow-ups add: the cloud .run installer, a v* tag
# trigger, and attaching the Linux assets to the release.
on:
  workflow_dispatch:

env:
  # NCNN is built from source (not in apt) and cached. Bump to rebuild.
  NCNN_VERSION: "20240820"

jobs:
  build-linux:
    # 24.04 ships FFmpeg 6 (new channel-layout API the code requires) and matches
    # the snap's core24 base. AppImage targets glibc 2.39 (Ubuntu 24.04+/Debian 13+).
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout revere
        uses: actions/checkout@v4
        with:
          path: revere
          fetch-depth: 0

      # Version-lock revere_cloud to the tag on tag builds (same policy as
      # Windows). For workflow_dispatch this resolves to main.
      - name: Determine revere_cloud ref
        id: cloudref
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REVERE_CLOUD_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            if gh api "repos/dicroce/revere_cloud/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "ref=${tag}" >> "$GITHUB_OUTPUT"
            else
              echo "::error::revere_cloud is missing tag '${tag}'. Tag it too:"
              echo "::error::(cd revere_cloud && git tag ${tag} && git push origin ${tag})"
              exit 1
            fi
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout revere_cloud
        uses: actions/checkout@v4
        with:
          repository: dicroce/revere_cloud
          ref: ${{ steps.cloudref.outputs.ref }}
          path: revere_cloud
          fetch-depth: 0
          token: ${{ secrets.REVERE_CLOUD_TOKEN }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git pkg-config patchelf file \
            libopencv-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            libssl-dev libsqlite3-dev uuid-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libgtk-3-dev libayatana-appindicator3-dev libcairo2-dev \
            libasound2-dev libpulse-dev \
            xvfb libgl1-mesa-dri

      # NCNN: build from source (apt has no suitable package), cached by version.
      - name: Restore cached NCNN
        id: cache-ncnn
        uses: actions/cache@v4
        with:
          path: ncnn-install
          key: ncnn-${{ runner.os }}-2404-${{ env.NCNN_VERSION }}

      - name: Build NCNN (cache miss only)
        if: steps.cache-ncnn.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${NCNN_VERSION}" https://github.com/Tencent/ncnn.git
          cmake -S ncnn -B ncnn-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/ncnn-install" \
            -DNCNN_BUILD_TOOLS=OFF -DNCNN_BUILD_EXAMPLES=OFF \
            -DNCNN_BUILD_TESTS=OFF -DNCNN_BUILD_BENCHMARK=OFF \
            -DNCNN_SHARED_LIB=ON -DNCNN_VULKAN=OFF
          cmake --build ncnn-build --parallel "$(nproc)"
          cmake --install ncnn-build

      - name: Configure
        run: |
          cmake -S revere -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DREVERE_PORTABLE_BUILD=ON \
            -DEXTERNAL_PLUGIN_REPOS="${GITHUB_WORKSPACE}/revere_cloud" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/AppDir/usr"
        env:
          NCNN_TOP_DIR: ${{ github.workspace }}/ncnn-install

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Install into AppDir
        run: cmake --install build
        env:
          NCNN_TOP_DIR: ${{ github.workspace }}/ncnn-install

      # The CMake install lays everything (exe, our .so, ui.rbt, models/,
      # motion_plugins/, gstreamer_plugins/, system_plugins/) under usr/revere/.
      # The app chdir's to its exe dir at startup, so those relative dirs resolve.
      # We:
      #  - rename usr/revere -> usr/bin: linuxdeploy requires the main executable
      #    in the FHS usr/bin. Keeping the whole self-contained dir AS usr/bin
      #    means the exe is where linuxdeploy expects AND all the sibling
      #    resources (models/, ui.rbt, plugins) stay next to it for the app's
      #    chdir-relative lookups. ($ORIGIN rpath survives the dir move.)
      #  - drop system_plugins (the cloud plugin) — the app AppImage ships
      #    cloud-free; cloud is delivered separately as a .run (follow-up).
      #  - drop the app's bundled gstreamer_plugins and let
      #    linuxdeploy-plugin-gstreamer bundle a complete, rpath-correct set into
      #    usr/lib/gstreamer-1.0.
      - name: Prune AppDir and align to FHS bin layout
        run: |
          set -euo pipefail
          rm -rf AppDir/usr/revere/system_plugins
          rm -rf AppDir/usr/revere/gstreamer_plugins
          mv AppDir/usr/revere AppDir/usr/bin
          echo "AppDir/usr/bin contents:"; ls -la AppDir/usr/bin

      - name: Stage desktop file and icon
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp revere/apps/revere/R.png AppDir/revere.png
          cp revere/apps/revere/R.png AppDir/usr/share/icons/hicolor/256x256/apps/revere.png
          cat > AppDir/revere.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Revere
          Exec=revere
          Icon=revere
          Categories=AudioVideo;Video;
          Terminal=false
          EOF
          cp AppDir/revere.desktop AppDir/usr/share/applications/revere.desktop

      # AppRun: enter the exe directory (the app also does this itself, but we set
      # cwd up front so relative lookups are correct even before _set_working_dir),
      # wire GStreamer to the bundled plugins, and DO NOT touch libGL/driver libs
      # (SDL2 uses the host's GL — bundling them is what broke earlier attempts).
      # Write the custom AppRun OUTSIDE AppDir. linuxdeploy's --custom-apprun
      # copies this into AppDir/AppRun, so source and destination must differ
      # (pointing it at AppDir/AppRun itself is a self-copy and errors out).
      - name: Write AppRun
        run: |
          set -euo pipefail
          cat > AppRun.custom <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$HERE/usr/bin:${LD_LIBRARY_PATH:-}"
          export GST_PLUGIN_SYSTEM_PATH="$HERE/usr/lib/gstreamer-1.0"
          export GST_PLUGIN_PATH="$HERE/usr/lib/gstreamer-1.0"
          export GST_PLUGIN_SCANNER="$HERE/usr/lib/gstreamer-1.0/gst-plugin-scanner"
          export GIO_USE_PROXY_RESOLVER=dummy
          cd "$HERE/usr/bin"
          exec "$HERE/usr/bin/revere" "$@"
          EOF
          chmod +x AppRun.custom

      - name: Download AppImage tooling
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          base=https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous
          gst=https://github.com/linuxdeploy/linuxdeploy-plugin-gstreamer/raw/master
          curl -sSLO "$base/linuxdeploy-x86_64.AppImage"
          curl -sSLO "$gst/linuxdeploy-plugin-gstreamer.sh"
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gstreamer.sh

      - name: Bundle dependencies and build AppImage
        run: |
          set -euo pipefail
          export OUTPUT="Revere-x86_64.AppImage"
          # linuxdeploy must find (a) our own libs, which the install put next to
          # the executables in usr/bin, and (b) libncnn from the NCNN build, which
          # only the dlopen'd yolov8 plugin needs.
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/AppDir/usr/bin:${GITHUB_WORKSPACE}/ncnn-install/lib:${LD_LIBRARY_PATH:-}"
          # The motion plugins are dlopen'd at runtime, so they are NOT dependencies
          # of revere/vision and linuxdeploy won't process them by default — meaning
          # libncnn (+ libgomp) would be missing. --deploy-deps-only makes linuxdeploy
          # bundle each plugin's transitive deps into usr/lib without relocating the
          # plugin itself (it stays in usr/bin/motion_plugins for the app's lookup).
          deps_only=()
          for so in AppDir/usr/bin/motion_plugins/*.so; do
            deps_only+=( --deploy-deps-only "$so" )
          done
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --executable AppDir/usr/bin/revere \
            --executable AppDir/usr/bin/vision \
            "${deps_only[@]}" \
            --custom-apprun AppRun.custom \
            --desktop-file AppDir/revere.desktop \
            --icon-file AppDir/revere.png \
            --plugin gstreamer \
            --output appimage
          ls -la *.AppImage

      - name: Smoke test
        run: |
          # GitHub's default shell is `bash -eo pipefail {0}`, so errexit is ON
          # unless we disable it. The diagnostics below intentionally run commands
          # that return non-zero (grep no-match, `wait` on a crashed app), and we
          # MUST keep running to print the app's stderr. Disable errexit explicitly.
          set +e
          set -u
          fail=0

          # 1) Unresolved shared libraries? Inspect the AppImage's REAL runtime tree
          # (extract it so rpaths/AppRun env match what users get), printing full
          # ldd output so any missing lib is visible.
          chmod +x Revere-x86_64.AppImage
          ./Revere-x86_64.AppImage --appimage-extract >/dev/null 2>&1 || true
          # ldd with the SAME library path the app uses at runtime (AppRun adds
          # usr/lib + usr/bin), so dlopen'd plugins' deps resolve as they actually
          # will. Anything still "not found" (minus deliberately-unbundled host
          # libGL/driver libs) is a genuine packaging bug.
          export LD_LIBRARY_PATH="$PWD/squashfs-root/usr/lib:$PWD/squashfs-root/usr/bin:${LD_LIBRARY_PATH:-}"
          echo "=== checking for unresolved libraries (runtime LD_LIBRARY_PATH applied; host libGL excluded) ==="
          while IFS= read -r bin; do
            echo "----- ldd $bin"
            out="$(ldd "$bin" 2>/dev/null || true)"
            echo "$out"
            miss="$(echo "$out" | grep 'not found' | grep -viE 'libGL|libEGL|libGLX|libGLdispatch|i965|iris|swrast|libgallium' || true)"
            if [ -n "$miss" ]; then
              echo "::error::unresolved libs in $bin:"; echo "$miss"
              fail=1
            fi
          done < <(find squashfs-root/usr/bin -maxdepth 2 -type f \( -name 'revere' -o -name 'vision' -o -name '*.so' \) 2>/dev/null)

          # Diagnostics: show the real layout inside the extracted image.
          echo "=== squashfs-root/usr ==="; ls -la squashfs-root/usr || true
          echo "=== file squashfs-root/usr/bin ==="; file squashfs-root/usr/bin || true
          echo "=== squashfs-root/usr/bin (head) ==="; ls -la squashfs-root/usr/bin 2>&1 | head -20 || true

          # 2) Launch in the foreground under xvfb with an explicit timeout and
          # capture the exit code. The app runs until we kill it via timeout, so a
          # clean run exits 124 (timeout sent TERM) or 143 (128+SIGTERM) — those are
          # SUCCESS (it stayed up). Any other code (e.g. 134 = abort) is a real
          # startup failure. We always print the app's output for diagnostics.
          # NOTE: the app derives its data dir from getpwuid()->pw_dir (NOT $HOME),
          # i.e. /home/runner, and now creates ~/Documents itself if missing.
          # The app needs OpenGL for SDL_CreateWindow; plain xvfb has no GL driver,
          # so force Mesa software rendering (llvmpipe via libgl1-mesa-dri). This
          # is the HOST providing GL — consistent with not bundling libGL.
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          echo "=== launching extracted AppRun under xvfb (software GL) ==="
          xvfb-run -a --server-args="-screen 0 1280x1024x24" timeout --preserve-status 20s ./squashfs-root/AppRun > /tmp/revere_run.log 2>&1
          rc=$?
          echo "=== app exited rc=$rc ==="
          echo "=== BEGIN app output ==="; cat /tmp/revere_run.log 2>&1 || true; echo "=== END app output ==="
          if [ "$rc" = "124" ] || [ "$rc" = "143" ]; then
            echo "launch OK (ran until timeout)"
          else
            echo "::error::app did not stay up (rc=$rc) — see output above"
            fail=1
          fi

          [ "$fail" -eq 0 ] || { echo "::error::smoke test failed"; exit 1; }
          echo "smoke test OK"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: Revere-x86_64.AppImage
          if-no-files-found: error
