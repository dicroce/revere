<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="Revere">
  <!-- The Revere mark, compact geometry for small sizes: outer square 12,12 → 52,52 (40×40) with a 3.5 stroke;
       inner stamp 27,27 → 37,37 (10×10) filled. build-icons.sh renders the desktop icons from these numbers. -->
  <rect x="12" y="12" width="40" height="40" stroke="currentColor" stroke-width="3.5"/>
  <rect x="27" y="27" width="10" height="10" fill="currentColor"/>
</svg>
