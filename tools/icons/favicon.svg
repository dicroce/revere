<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" fill="currentColor" role="img" aria-label="Revere">
  <!-- The Revere mark, 16 px cut (the belfry design/logo/revere-shutter-16.svg), no tile: ink on light tabs, white on dark. For 16 and 32 px only. -->
  <style>:root{color:#18181b}@media (prefers-color-scheme:dark){:root{color:#ffffff}}</style>
  <rect x="2" y="2" width="7" height="4"/>
  <rect x="10" y="2" width="4" height="7"/>
  <rect x="7" y="10" width="7" height="4"/>
  <rect x="2" y="7" width="4" height="7"/>
</svg>
